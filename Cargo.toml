[package]
name = "pinnglass"
version = "0.1.0"
edition = "2021"
authors = ["Lyvn"]
description = "Ultra-fast, lightweight GPU-accelerated image viewer in Rust for Windows 10/11"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "wgpu", "clipboard", "system_fonts"] }
egui = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "ico", "tiff", "hdr", "rayon"] }
resvg = "0.49.0"
usvg = "0.49.0"
kamadak-exif = "0.6.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam-channel = "0.5"
rayon = "1.10"
notify = "8.0.0"
parking_lot = "0.12"
directories = "6.0.0"

[lib]
name = "pinnglass"
path = "src/lib.rs"

[[bin]]
name = "pinnglass"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_UI_Shell",
    "Win32_Globalization",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
